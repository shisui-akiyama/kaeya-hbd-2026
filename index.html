<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111923"><meta property="og:title" content="孔雀の羽を纏うカラス｜銀緋の夜"><meta property="og:description" content="ガイアを主人公にした非公式テキスト推理アドベンチャー。銀緋血をめぐる夜の事件と、家族の物語。"><title>孔雀の羽を纏うカラス｜銀緋の夜</title><style>:root{color-scheme:dark;--bg:#101820;--panel:#1b2730;--line:#44515a;--text:#f0ede7;--muted:#b9c3c6;--gold:#dfc18a;--red:#bb7884}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#26313d,#101820 56%);color:var(--text);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;line-height:1.85}main{max-width:730px;margin:auto;min-height:100dvh;padding:24px 18px 90px}.eyebrow{font-size:.76rem;letter-spacing:.18em;color:var(--gold)}h1{font-family:serif;font-size:clamp(1.9rem,7vw,3rem);line-height:1.45;letter-spacing:.07em;margin:14px 0}h2{font-family:serif;font-size:1.55rem;line-height:1.5;margin:12px 0 20px}.subtitle{color:var(--muted);font-size:.95rem}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px 0}.card{border:1px solid var(--line);background:rgba(27,39,48,.85);padding:22px 18px;border-radius:14px;box-shadow:0 12px 32px #0003}.story p{white-space:pre-wrap;margin:0 0 1.2em}.speaker{color:var(--gold);font-weight:700;display:block;margin-bottom:3px}.dialogue{padding-left:12px;border-left:2px solid #677581}.scene{color:var(--muted);font-size:.81rem;letter-spacing:.07em}.choices{display:grid;gap:10px;margin-top:25px}button{font:inherit;line-height:1.55;text-align:left;background:#273642;border:1px solid #697681;border-radius:10px;padding:14px 16px;color:var(--text);cursor:pointer;touch-action:manipulation}button:hover,button:focus-visible{border-color:var(--gold);background:#354450;outline:none}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#73565d;border-color:#ba9199}.primary:hover{background:#8b646e}.small{font-size:.83rem;padding:9px 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.top .eyebrow{margin:0}.status{color:var(--muted);font-size:.78rem}.hint{font-size:.84rem;color:var(--muted);margin-top:14px}.evidence{border-left:2px solid var(--gold);padding:8px 12px;margin:10px 0;background:#25313a}.ending{color:var(--gold);letter-spacing:.08em}.footer{font-size:.75rem;color:var(--muted);margin-top:25px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e0caa3;color:#1a222a;border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:.82rem;max-width:90vw}#toast.show{opacity:1}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><main id="app" aria-live="polite"></main><div id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='crow-peacock-v1';let s={node:'start',mask:0,trust:0,insight:0,clues:[],visited:[],share:'',deduced:false,proof:false,route:'',mistake:false};const app=document.getElementById('app');const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.node==='string'&&Array.isArray(v.clues)&&Array.isArray(v.visited))s={...s,...v}}catch(e){}}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function text(t){return `<p>${esc(t)}</p>`}function say(w,t){return `<p class="dialogue"><span class="speaker">${esc(w)}</span>${esc(t)}</p>`}function clue(id,label){if(!s.clues.includes(id)){s.clues.push(id);toast('手掛かりを入手：'+label)}}function choice(label,to,fn,disabled=false){return {label,to,fn,disabled}}function render(title,loc,html,opts=[],extra=''){app.innerHTML=`<div class="top"><span class="eyebrow">孔雀の羽を纏うカラス</span><button class="small" id="restart">最初から</button></div><div class="card"><div class="scene">${esc(loc)}</div><h2>${esc(title)}</h2><div class="rule"></div><div class="story">${html}</div>${extra}<div class="choices">${opts.map((o,i)=>`<button data-choice="${i}" ${o.disabled?'disabled':''}>${esc(o.label)}</button>`).join('')}</div></div><div class="footer">非公式ファン創作。物語中の銀緋血・人物・文献・事件は独自設定です。進行状況はこの端末に自動保存されます。</div>`;document.getElementById('restart').onclick=()=>{if(confirm('最初からやり直しますか？')){s={node:'start',mask:0,trust:0,insight:0,clues:[],visited:[],share:'',deduced:false,proof:false,route:'',mistake:false};go('start')}};app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let o=opts[+b.dataset.choice];if(o.fn)o.fn();go(o.to)});save();scrollTo(0,0)}function go(id){s.node=id;scenes[id]();}function investigate(id,label,description){s.visited.push(id);clue(id,label);go('investigate')}
const scenes={
start(){render('銀緋の夜','TEXT MYSTERY / 3 ENDINGS',text('人々は、銀色の血を「奇跡」と呼んだ。')+text('だが、孔雀の羽を纏ったカラスは知っている。美しい噂ほど、時に残酷なものはない。')+text('夜のモンド。ガイア・アルベリヒは、奇妙な古文書の買い占めと、消えた薬師たちの噂を追う。')+text('彼の血は銀と赤が等しく混ざる「銀緋血」。その色を、義兄ディルックは昔から知っている。'),[choice('物語を始める','intro')],'<p class="hint">約15〜25分。選択と推理によって結末が変化します。</p>')},
intro(){render('第一章　羽根の下の噂','21:30 / 西風騎士団 図書館',say('リサ','ここ数日、古い北方の伝承を探す人が増えたの。しかも、同じ頁ばかり。')+say('ガイア','銀色の血で人が癒える、だったかな。随分と景気のいい噂だ。')+say('リサ','ヒュペルボレイアの民に関する写本よ。ただし、伝承と事実は分けて読まなくちゃね。')+text('写本の余白には、後代の書き込みがある。「銀の血が赤と交わるとき、銀緋となる」。出典は不明だ。')+say('ガイア','……誰かがこの話を信じて、動き始めたってわけか。'),[choice('街で情報を集める','investigate')])},
investigate(){let places=[['library','図書館の貸出記録','貸出記録には、エルヴィン・ロートの代理人が古文書を閲覧した痕跡がある。複写された頁は「血の治癒」と「混血」の項目だけだった。'],['alley','裏通りの聞き込み','夜番の騎士は、薬師を訪ねる不審な商人と、囁きの森へ向かう荷車を見たという。荷車の印は黒い三角形。'],['tavern','酒場の帳簿','ディルックは、黒い三角形の印を持つ荷車が、取引品を運ばず空の容器だけを積んでいたと教える。']];let opts=places.filter(x=>!s.visited.includes(x[0])).map(x=>choice('調べる：'+x[1],'investigate',()=>{s.visited.push(x[0]);clue(x[0],x[1]);s.last=x[2]}));let html=text('調査先を選ぼう。三つの情報を集めると、事件の輪郭が見えてくる。');if(s.last)html+=`<div class="evidence">${esc(s.last)}</div>`;html+=`<p class="hint">調査済み ${s.visited.length}/3</p>`;if(s.visited.length===3)opts.push(choice('集めた情報を整理する','tavernTalk'));render('第一章　羽根の下の噂','22:15 / モンド城',html,opts)},
tavernTalk(){render('第二章　奇跡を買う手','23:05 / エンジェルズシェア',say('ディルック','ガイアさん。君が調べている商人は、僕の取引先にも接触している。')+say('ガイア','おや。まさか旦那から声をかけてもらえるとはね。')+say('ディルック','エルヴィン・ロート。病を抱えた家族のため、古い治癒術に執着しているそうだ。だが、手段を選ばなくなっている。')+say('ガイア','銀色の血、か。迷信で済めばいいんだが。')+say('ディルック','……彼は「銀に赤が混ざった血」についても尋ねていた。君はこの件から手を引くべきだ。')+text('ディルックは血の色を知っている。驚いているのではない。ガイアが標的になったことを警戒しているのだ。'),[choice('「ただの噂さ。心配しすぎじゃないか？」','plan',()=>{s.mask+=2;s.share='hide'}),choice('「知っていることを、全部聞かせてくれ」','plan',()=>{s.trust++;s.insight++;s.share='facts'}),choice('「……俺のことを調べているなら、放っておけない」','plan',()=>{s.trust+=2;s.share='open'})])},
plan(){let r=s.share==='hide'?say('ディルック','君の軽口に付き合うつもりはない。今夜は気をつけろ。'):s.share==='facts'?say('ディルック','黒い三角形の印は、廃れた運送組合のものだ。僕も別口から調べる。'):say('ディルック','……わかった。だが、ガイアさん。何かあれば知らせてくれ。');render('第二章　奇跡を買う手','23:30 / 酒場の出口',r+text('ディルックは、商人が囁きの森の廃墟で取引するという情報を掴んでいた。')+text('ガイアは現場に向かう。相手の狙いを確かめるために。'),[choice('囁きの森へ向かう','evidence')])},
evidence(){render('第三章　誘いの足跡','00:15 / 囁きの森',text('廃墟には、取引にしては不自然な痕跡が残されていた。')+`<div class="evidence">証拠①　運搬用の容器は空だった。</div><div class="evidence">証拠②　取引場所は、人目につきやすい一本道の廃墟だった。</div><div class="evidence">証拠③　手紙には「血を持ってこい」ではなく「対象を連れてこい」と書かれていた。</div>`+say('ガイア','……なるほど。取引そのものが餌か。'),[choice('血液の売買を装った詐欺だ','wrongDeduce'),choice('血の持ち主を誘い出す罠だ','rightDeduce'),choice('商人同士の争いだ','wrongDeduce')])},
wrongDeduce(){s.mistake=true;render('第三章　誘いの足跡','00:20 / 廃墟の入口',text('考え直そう。空の容器、一本道、そして「対象」という言葉。')+say('ガイア','……いや、違うな。取引の品が血なら、なぜ持ち主を連れてくる必要がある？'),[choice('証拠をもう一度検討する','evidence')])},
rightDeduce(){s.insight+=2;s.deduced=true;render('第三章　誘いの足跡','00:25 / 廃墟の入口',say('ガイア','俺が追っていたつもりが、向こうに追わせられていたってわけか。')+text('罠だと気づいた。ならば引き返して増援を呼ぶべきだ。だが、石壁に刻まれた文字が足を止める。')+text('「アルベリヒ」。')+text('相手は自分の名を知っている。誰が教えたのか。どこまで知っているのか。')+text('ガイアは、その答えを急いでしまう。'),[choice('単独で奥へ進む','trap',()=>{s.mask++}),choice('騎士団に目印を残して奥へ進む','trap',()=>{s.insight++;s.proof=true})])},
trap(){render('第四章　銀緋の影','00:45 / 廃墟地下',say('エルヴィン','ガイア・アルベリヒ。ようやく会えた。')+say('ガイア','俺に会いたいなら、酒場で一杯おごってくれればよかったのに。')+say('エルヴィン','古文書にある銀緋血……その力で、家族を救えるかもしれない。')+say('ガイア','「かもしれない」で人を罠にかけるのか？')+text('エルヴィンの仲間が退路を塞ぐ。ガイアは氷元素で道を開こうとするが、隠された仕掛けを見落とした。')+text('身をかわしたものの腕を負傷し、外套に鈍い赤銀色がにじむ。銀と赤が半分ずつ混ざった、銀緋血。')+say('ガイア','……ああ、これは失敗したな。')+say('エルヴィン','その色……やはり！')+text('そのとき、通路の奥に炎の光が揺れた。'),[choice('声の方を振り向く','rescue')])},
rescue(){let line=s.share==='hide'?'君が隠し事をするときの顔は、昔から変わらない。':s.share==='facts'?'君が教えた荷車の情報と、僕が追っていた運送組合の印が一致した。':'君が一人で向かうかもしれないと思った。だから僕も、別の入口を調べていた。';render('第四章　銀緋の影','00:55 / 廃墟地下',say('ディルック','……ガイアさん。やはりここにいたか。')+say('ガイア','おやおや。まるで示し合わせたみたいじゃないか。')+say('ディルック',line)+text('ディルックは別の入口から運搬路を追い、騒ぎを聞きつけて合流した。二人が協力すると、商人たちは逃げ道を失い、追ってきた騎士団に確保される。')+text('ディルックはガイアの袖に目を落とす。銀緋血を見ても、表情は変わらない。')+say('ディルック','手当てをする。君は座っていてくれ。')+say('ガイア','……この色を見ても、何も聞かないんだな。')+say('ディルック','知っているだろう。僕が気にしているのは血の色じゃない。君が無事かどうかだ。'),[choice('「大したことないさ」','aftercare',()=>{s.mask+=2;s.route='hide'}),choice('「……少し手を貸してくれるか」','aftercare',()=>{s.trust+=2;s.route='help'}),choice('「なあ、どうして来てくれた？」','aftercare',()=>{s.trust++;s.insight++;s.route='ask'})])},
aftercare(){let a=s.route==='hide'?say('ディルック','無理をしているのは見ればわかる。今はじっとしていてくれ。'):s.route==='help'?say('ディルック','……ああ。最初からそう言えばいい。'):say('ディルック','君が危険な場所へ向かったと知って、放っておけなかった。それだけだ。');render('第五章　羽根を脱ぐ夜','02:10 / アカツキワイナリー',text('安全を確保したディルックは、ガイアをワイナリーへ連れてきた。必要な手当てを済ませ、医師の確認を待つ。')+a+say('ガイア','あの商人は、家族を救いたかったらしい。')+say('ディルック','事情は理解できる。だが、君を傷つけていい理由にはならない。')+say('ガイア','俺の血が本当に人を癒すかも、わからないのにな。')+say('ディルック','伝承は伝承だ。君自身の価値を、そんなものに決めさせるな。')+text('ディルックは古文書の複写を差し出した。写本の末尾には、別の筆跡がある。'),[choice('最後の手掛かりを読む','finalPuzzle')])},
finalPuzzle(){render('最終推理　奇跡の値段','02:25 / アカツキワイナリー',`<div class="evidence">古文書の本文：「北の民の銀の血は、癒やしをもたらすという」</div><div class="evidence">後代の注釈：「銀と赤が交われば、銀緋となる」</div><div class="evidence">商人の依頼書：「アルベリヒの血は奇跡を保証する」</div>`+say('ガイア','……おや。誰かが伝承に勝手な続きを書き足したらしい。')+text('この三つの記述から、確実に言えることは何だろう？'),[choice('銀緋血の治癒能力は証明されている','finalWrong'),choice('銀色の血の伝承が、銀緋血にまで拡大解釈された','finalRight'),choice('古文書の内容はすべて嘘だ','finalWrong')])},
finalWrong(){render('最終推理　奇跡の値段','02:30 / アカツキワイナリー',say('ガイア','……いや、断定はできない。伝承、注釈、商人の思い込みを分けて考えよう。'),[choice('もう一度、記述を比べる','finalPuzzle')])},
finalRight(){s.insight+=2;render('最終章　カラスの帰る場所','夜明け前 / アカツキワイナリー',say('ガイア','銀の血に癒やしの伝承がある。だが、銀緋血まで同じだとは誰も証明していない。')+say('ディルック','商人は欲しい結論に合わせて文献を読んだ。誰かがそれを利用した可能性もある。')+text('騎士団には、商人の犯行と古文書の偽装を報告できる。ただし、ガイア個人の血の詳細を公表する必要はない。')+say('ガイア','……それでも、誰かが俺の名を商人に教えた。事件はまだ終わっていないのかもしれないな。')+say('ディルック','なら、次は一人で追わないことだ。')+text('窓の外に、夜明けの気配が差し込む。'),[choice('何も言わず、いつもの軽口で帰る','end1',()=>{s.mask+=2}),choice('秘密を守りながら、協力を約束する','end2',()=>{s.trust++}),choice('「……ここにいても、いいか？」','end3',()=>{s.trust+=2},s.trust<3||s.insight<4)])},
end1(){ending('END 1　仮面を纏うカラス',say('ガイア','さて、夜遊びもほどほどにしないとな。世話になったよ、ディルックの旦那。')+say('ディルック','医師の許可が出るまでは休んでいてくれ。……君はいつも急ぎすぎる。')+text('事件の記録は整い、噂の出所も追跡対象となった。ガイアは秘密を守り抜く。')+text('それでも、借りた外套を返すときだけ、いつもの冗談が少し遅れた。'))},
end2(){ending('END 2　言葉にしない約束',say('ガイア','俺の血のことは、まだ誰にも話したくない。だが、事件の続きを追うなら……あんたにも協力してほしい。')+say('ディルック','もちろんだ。僕も調べておく。君の秘密を、勝手に他人へ話したりはしない。')+say('ガイア','……頼りにしてるよ。')+text('二人は同じ謎を、別々の立場から追うことにした。すべてを話さなくても、信じられる相手はいる。'))},
end3(){ending('END 3　奇跡よりも大切なもの',say('ガイア','……ここにいても、いいか？')+text('ディルックは一瞬だけ言葉を止めた。暖炉の火が、二人の間で静かに揺れる。')+say('ディルック','……今夜は、最初からそのつもりだった。')+say('ガイア','俺の血に奇跡なんて、ないかもしれないぜ。')+say('ディルック','それで構わない。僕にとって、君は奇跡のためにここにいるわけじゃない。')+text('ガイアは、長く言えなかった言葉を小さく口にした。')+say('ガイア','……ただいま。')+say('ディルック','……おかえり、ガイア。')+text('孔雀の羽を纏ったカラスは、今夜だけは羽根を飾らず、夜明けを迎えた。'))}
};function ending(title,html){render(title,'THE END',`<p class="ending">${esc(title)}</p>`+html,[choice('最初から別の結末を探す','start',()=>{s={node:'start',mask:0,trust:0,insight:0,clues:[],visited:[],share:'',deduced:false,proof:false,route:'',mistake:false}})])}load();if(!scenes[s.node])s.node='start';go(s.node);
})();</script></body></html>
