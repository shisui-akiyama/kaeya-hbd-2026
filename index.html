<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111923"><meta property="og:title" content="孔雀の羽を纏うカラス｜白銀の夜"><meta property="og:type" content="website"><meta property="og:url" content="https://shisui-akiyama.github.io/kaeya-hbd-2026/"><meta property="og:image" content="https://shisui-akiyama.github.io/kaeya-hbd-2026/thumbnail.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://shisui-akiyama.github.io/kaeya-hbd-2026/thumbnail.png"><meta property="og:description" content="ガイアを主人公とした非公式テキスト推理アドベンチャー。銀の血を巡る夜の事件と家族の物語。"><title>孔雀の羽を纏うカラス｜白銀の夜</title><style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2730;--line:#44515a;--text:#f0ede7;--muted:#b9c3c6;--gold:#dfc18a;--red:#bb7884}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% 0%,#26313d,#101820 56%);color:var(--text);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;line-height:1.85}main{max-width:730px;margin:auto;min-height:100dvh;padding:22px 16px 110px}.eyebrow{font-size:.75rem;letter-spacing:.13em;color:var(--gold)}h1{font-family:serif;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1.4}h2{font-family:serif;font-size:clamp(1.25rem,5vw,1.65rem);line-height:1.5;margin:12px 0 20px}.subtitle{color:var(--muted)}.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0}.card,.notebook{border:1px solid var(--line);background:rgba(27,39,48,.92);padding:20px 16px;border-radius:14px;box-shadow:0 12px 32px #0003}.story p{white-space:pre-wrap;margin:0 0 1.2em}.speaker{color:var(--gold);font-weight:700;display:block;margin-bottom:3px}.dialogue{padding-left:12px;border-left:2px solid #677581}.scene{display:inline-flex;align-items:center;color:#f4e6cd;background:#394651;border:1px solid #85745f;border-radius:8px;padding:6px 12px;font-size:.9rem;font-weight:650;letter-spacing:.06em;margin:0 0 10px}.choices{display:grid;gap:10px;margin-top:25px}button{font:inherit;line-height:1.55;text-align:left;background:#273642;border:1px solid #697681;border-radius:10px;padding:13px 15px;color:var(--text);cursor:pointer;touch-action:manipulation}button:hover,button:focus-visible{border-color:var(--gold);background:#354450;outline:none}.primary{background:#73565d;border-color:#ba9199}.small{font-size:.83rem;padding:9px 12px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}.hint,.footer{font-size:.8rem;color:var(--muted)}.footer{margin-top:20px}.evidence{border-left:2px solid var(--gold);padding:10px 12px;margin:12px 0;background:#25313a}.chosen{border:1px solid #786d67;border-left:3px solid var(--gold);border-radius:9px;padding:12px 14px;margin:20px 0;background:#29333a}.chosen .speaker{font-size:.8rem}.ending-title{margin:26px 0 8px;text-align:center;color:var(--gold);font-family:serif;font-size:1.55rem;letter-spacing:.08em}.ending-number{text-align:center;font-size:.72rem;letter-spacing:.2em;color:var(--muted)}.notebook{margin-top:15px;padding:0;overflow:hidden}.notebook summary{cursor:pointer;padding:13px 16px;font-weight:700;color:var(--gold);list-style:none;display:flex;justify-content:space-between;gap:10px}.notebook summary::-webkit-details-marker{display:none}.notebook .entries{padding:0 16px 16px}.entry{border-top:1px solid #40505a;padding:11px 0}.entry strong{display:block;font-size:.9rem}.entry p{margin:3px 0 0;font-size:.82rem;color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.toolbar button{flex:1 1 190px;text-align:center}.history{margin-bottom:18px}.history details{border:1px solid var(--line);border-radius:9px;padding:8px 12px}.history summary{font-size:.83rem;color:var(--muted);cursor:pointer}.history .line{padding:10px 0;border-bottom:1px solid #40505a;font-size:.85rem}.history .line:last-child{border-bottom:0}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e0caa3;color:#1a222a;border-radius:8px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .2s;font-size:.82rem;max-width:90vw;z-index:5}#toast.show{opacity:1}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}@media(max-width:400px){.card{padding:17px 13px}.top .eyebrow{font-size:.66rem}}
</style></head><body><main id="app" aria-live="polite"></main><div id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='crow-peacock-v5';const blank=()=>({node:'start',mask:0,trust:0,insight:0,clues:[],visited:[],share:'',route:'',deduced:false,proof:false,mistake:false,last:'',echo:'',log:[],ending:''});let s=blank();const app=document.getElementById('app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=t=>`<p>${esc(t)}</p>`;const say=(w,t)=>`<p class="dialogue"><span class="speaker">${esc(w)}</span>${esc(t)}</p>`;const note=t=>`<div class="evidence">${esc(t)}</div>`;const C=(label,to,fn,show=true)=>({label,to,fn,show});const clueData={agent:['代理人の正体','図書館の閲覧者ノルベルトは、エルヴィン・ロートの代理人だった。'],book:['『北境異聞録』の写し','ヒュペルボレイアの銀色の血に関する伝承。血統への継承を述べた記述は後世の注釈で、出典がない。'],library:['古文書の閲覧履歴','「癒やし」と「血統」の頁だけを複写した閲覧者がいた。'],alley:['夜番の証言','薬師を訪ねる商人と、黒い三角印の荷車が囁きの森へ向かった。'],tavern:['空の容器と荷車の印','運搬容器は空。印は廃業した運送組合のもので、ディルックも別口で追っている。'],ledger:['依頼書の不自然な文言','「血を運べ」ではなく「対象を連れてこい」。取引は人を誘うための偽装らしい。'],private:['血の色を記した調査票','姓ではなく、銀色の血が「確認済み」と書かれている。誰が確認したのかは不明。'],trap:['偽装された取引','空の容器、一本道、依頼書を照合すると、狙いは血の持ち主本人だった。'],margin:['異なる筆跡の注釈','銀色の血の治癒伝承と、ガイアの血にも同じ力があるという主張は別物。'],seal:['取引先への送金控え','商人の家族の治療費と、手配人への支払いが混在。背後に情報提供者がいる。']};function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v.node==='string'&&Array.isArray(v.clues)&&Array.isArray(v.visited))s={...blank(),...v}}catch(e){}}function addClue(id){if(!s.clues.includes(id)){s.clues.push(id);}}function notebook(){return `<details class="notebook" id="notebook"><summary>手がかり帳 <span>${s.clues.length}件 ▾</span></summary><div class="entries">${s.clues.length?s.clues.map(id=>`<div class="entry"><strong>${esc(clueData[id][0])}</strong><p>${esc(clueData[id][1])}</p></div>`).join(''):'<p class="hint">手がかりはまだありません。調査を進めましょう。</p>'}</div></details>`}function render(title,loc,body,opts=[],extra='',ending=false){const visible=opts.filter(o=>o.show);const echo=s.echo?(s.echo.startsWith('「')?say('ガイア',s.echo):p(s.echo)):'';app.innerHTML=`<div class="top"><span class="eyebrow">孔雀の羽を纏うカラス</span><button class="small" id="restart">最初から</button></div><div class="card"><h2>${esc(title)}</h2><div class="scene">${esc(loc)}</div><div class="rule"></div><div class="story">${echo}${body}</div>${extra}<div class="choices">${visible.map((o,i)=>`<button data-choice="${i}">${esc(o.label)}</button>`).join('')}</div>${ending?'<div class="toolbar"><button id="shareX">Xでエンディングをシェア</button><button id="saveImage" class="primary">エンディング画像を保存</button></div>':''}</div>${notebook()}<div class="footer">非公式ファン創作。ガイアの銀色の血・登場人物の独自設定・文献・事件は創作です。進行状況は端末に保存されます。エンディング画像は文字だけのオリジナルカードです。</div>`;document.getElementById('restart').onclick=()=>{if(confirm('進行状況を消して最初からやり直しますか？')){s=blank();go('start')}};app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const o=visible[Number(b.dataset.choice)];s.echo=(visible.length===1||['start','intro','investigate','investigateResult','evidence','rightDeduce','plan','aftercare','trap'].includes(s.node)||['end1','end2','end3'].includes(o.to))?'':o.label.replace(/^[A-C]\.\s*/, '');if(o.fn)o.fn();go(o.to)});if(ending){document.getElementById('shareX').onclick=shareX;document.getElementById('saveImage').onclick=saveEndingImage}save();window.scrollTo({top:0,behavior:'instant'})}function go(id){s.node=id;scenes[id]()}function reset(){s=blank()}
const scenes={
start(){s.echo='';render('白銀の夜','TEXT MYSTERY / 3 ENDINGS',p('人々は、銀色の血を「奇跡」と呼んだ。')+p('どんな病も癒やすという、出所の知れない噂。')+p('それは人々に希望を与える一方で、ある者たちの欲望を静かに呼び覚ましていた。')+p('夜のモンド。騎兵隊長ガイア・アルベリヒは、奇妙な噂を追って、独自の調査を開始する。')+p('※ガイアがレッドミラーの血も引いていて銀色の血だったら、という仮説を採用しています。'),[C('物語を始める','intro')],'<p class="hint">テキストのみの推理アドベンチャー。手がかり帳・自動セーブに対応。</p>')},
intro(){addClue('book');render('序章　カラスに届いた噂','21:30 / 西風騎士団・図書館',say('リサ','最近、北方の古い伝承を探す人が増えているの。借りたいのは皆、同じ写本の同じ頁。妙でしょう？')+say('ガイア','銀色の血で人が癒える、だったか。随分と景気のいい噂だ。')+say('リサ','原文には「癒やしをもたらすという」とあるだけ。断言ではないわ。それに銀の血が他の血統に受け継がれるという話は、別の時代の書き込みなの。')+say('ガイア','つまり、誰かが二つの話を一つに繋げた……と。')+say('リサ','あなた、何か知っているの？')+say('ガイア','さあ。噂の出所を確かめたいだけさ。')+p('ガイアは写本の端に残る不自然な折り目を見つめた。後世の注釈だけが、何度も開かれたように擦れている。')+say('リサ','一つ忠告しておくわ。伝承を信じる人より、それを利用する人に気をつけて。')+say('ガイア','心得ておくよ。さて、夜はこれからだ。'),[C('情報を集める','investigate')])},
investigate(){const places=[['library','図書館の貸出記録'],['alley','裏通りの聞き込み'],['tavern','酒場の帳簿']];let opts=places.filter(([id])=>!s.visited.includes(id)).map(([id,label])=>C('調べる：'+label,'investigateResult',()=>{s.visited.push(id);addClue(id);s.last=id}));if(s.visited.length===3)opts.push(C('集めた情報を整理する','tavernTalk'));let body=p('情報を集める場所を選ぼう。');render('第一章　借り物の羽','22:15 / モンド城',body,opts)},
investigateResult(){let body='';if(s.last==='library')body+=say('司書','閲覧者はノルベルトという人物でした。写しを取ったのは、たった二頁です。')+say('ガイア','治癒と血統の頁だけか。ほかには目もくれなかったんだな。')+say('司書','ええ。何度も「原本はないのか」と尋ねられました。')+say('ガイア','……写しで満足できない理由があるらしい。');if(s.last==='alley')body+=say('夜番の騎士','黒い三角の印がある荷車を見ました。薬師の家の前に長く停まっていたんです。')+say('ガイア','荷物の積み下ろしは？')+say('夜番の騎士','見ていません。ただ、御者は森への道を何度も確認していました。')+say('ガイア','ありがとう。今夜は裏通りの巡回を増やしておいてくれ。');if(s.last==='tavern')body+=say('ディルック','ガイアさん。君が探している荷車なら、僕も見た。')+say('ガイア','おや。まさか旦那から声をかけてもらえるとは。')+say('ディルック','容器だけを積んでいた。中身を運んだ記録がない。何かを買いに来たのではなく、誰かを待っていた可能性がある。')+say('ガイア','……誰か、ね。');body+=`<p class="hint">調査済み ${s.visited.length}/3</p>`;render('第一章　借り物の羽','22:15 / モンド城',body,[C(s.visited.length===3?'集めた情報を整理する':'情報収集に戻る',s.visited.length===3?'tavernTalk':'investigate')])},
tavernTalk(){addClue('agent');render('第二章　羽の下に隠したもの','23:05 / エンジェルズシェア',(s.last!=='tavern'?p('ガイアは情報を照らし合わせるため、エンジェルズシェアに戻った。'):'')+say('ガイア','図書館で聞いたノルベルトという名前、荷車の手配記録にもあった。エルヴィン・ロートの代理人だったらしいな。')+say('ディルック','エルヴィン・ロートは希少な薬品を扱っていた商人だ。最近は家族の病を治す方法を探しているらしい。')+say('ガイア','切実な事情ってやつか。だが、薬師の家を嗅ぎ回るだけじゃ済まなさそうだな。')+say('ディルック','僕の取引先にも、古い血統の記録を売ってほしいと持ちかけていた。')+say('ガイア','へえ。ワインと血統書が一緒に並ぶ時代になったか。')+say('ディルック','冗談はいい。商人は「銀色の血」についても聞いていた。')+say('ガイア','……その話、どこまで広まっている？')+say('ディルック','まだ一部だと思う。だが、君が調べていると知られれば危険だ。')+say('ガイア','俺が逃げたら、次は別の誰かが狙われるかもしれないぜ？')+say('ディルック','だからといって、君一人で背負う理由にはならない。'),[C('「ただの噂さ。心配しすぎじゃないか？」','plan',()=>{s.mask+=2;s.share='hide'}),C('「知っていることを、全部聞かせてくれ」','plan',()=>{s.trust++;s.insight++;s.share='facts'}),C('「……俺のことを調べているなら、放っておけない」','plan',()=>{s.trust+=2;s.share='open'})])},
plan(){let response=s.share==='hide'?say('ディルック','君が何か隠しているのはわかる。けれど、軽口で危険が消えるわけじゃない。'):s.share==='facts'?say('ディルック','黒い三角印は廃業した運送組合のものだ。僕も運搬路を調べている。情報は共有しよう。'):say('ディルック','…………。');render('第二章　羽の下に隠したもの','23:30 / 酒場の出口',response+say('ガイア','商人が今夜、囁きの森で取引をするって話を聞いた。荷車の行き先とも一致する。')+say('ディルック','……森には古い地下道がある。正面から入れば、退路を塞がれやすい。')+say('ガイア','助言、ありがたく頂戴するよ。')+say('ディルック','……君が本当に聞いているといいが。'),[C('囁きの森へ向かう','evidence')])},
evidence(){addClue('ledger');addClue('private');render('第三章　罠に落ちる黒羽','00:15 / 囁きの森',p('廃墟の手前に残された帳面には、妙に整いすぎた記録があった。')+p('ガイアは運搬記録を一枚ずつめくる。容器の欄は空白のまま。取引場所は退路が一本しかない廃墟。そして依頼書には、荷物ではなく「対象を連れてこい」と記されている。')+p('帳面の裏に挟まれた調査票には、ガイアの名と銀色の血についての記述があった。')+p('暗闇の中、カンテラの灯を頼りに目を通したガイアは、数回またたきをするとハハッと笑った。')+say('ガイア','まるで、俺に読ませるために置いたみたいじゃないか。')+say('ガイア','容器は空。欲しいのは血そのものじゃなく、その持ち主……つまり、俺ってわけだ。'),[C('推理をまとめる','rightDeduce')])},
rightDeduce(){s.insight+=2;s.deduced=true;addClue('trap');render('第三章　罠に落ちる黒羽','00:25 / 廃墟の入口',say('ガイア','なるほど。俺が追っていたつもりが、向こうに追わせられていたってわけか。')+p('罠だとわかった以上、増援を待つのが正しい。だが、調査票の「確認済み」という一語が引っかかる。')+say('ガイア','俺の血のことを知る者は、そう多くないはずだ。……誰が売った？')+p('情報源を今夜逃せば、次はもっと多くの人間に秘密が広まるかもしれない。ガイアは焦りを自覚しながら、廃墟へ足を踏み入れる。'),[C('単独で奥へ進む','trap',()=>{s.mask++}),C('騎士団に合図を残して奥へ進む','trap',()=>{s.insight++;s.proof=true})])},
trap(){addClue('seal');render('第四章　白銀に染まる夜','00:45 / 廃墟地下',say('エルヴィン','ようやくお会いできました。ガイア・アルベリヒ殿。')+say('ガイア','待ち合わせなら、もっと明るい場所を選んでほしかったな。')+say('エルヴィン','古い文献に記された銀色の血……その力があれば、私の家族は救われるかもしれない。')+say('ガイア','「かもしれない」で人を誘い出すのか。ずいぶん危ない賭けだ。')+say('エルヴィン','何年も治療法を探した。あなたには、この気持ちがわからない！')+say('ガイア','わからないこともあるさ。だが、誰かを傷つける理由にはならない。')+p('ガイアは通路の奥に置かれた送金控えに目を留める。商人は誰かに多額の金を払っていた。')+say('ガイア','……あんた、誰から俺の情報を買った？')+p('返事の代わりに、通路の両側で仕掛けが動く。敵の人数と装置の位置を読み違えたガイアは、退路を開く際に腕を負傷した。')+p('外套に、白銀の光沢がにじむ。銀の血だ。')+say('ガイア','……これは、少々まずいな。')+say('エルヴィン','銀色……文献にあった通りだ！')+p('通路の奥に、炎の光が揺れた。'),[C('聞き慣れた声の方を振り向く','rescue')])},
rescue(){const line='しゃべる元気があるなら商人の捕縛でもしたらどうだ';render('第四章　白銀に染まる夜','00:55 / 廃墟地下',say('ディルック','……ガイアさん。やはりここにいたか。')+say('ガイア','ヒーローは遅れてやってくる、だったか？　さすがは闇夜のーー')+say('ディルック',line)+say('ガイア','はいはい、仰せのままに。')+p(s.proof?'ふたりは次々と商人たちを拘束した。騎士団の到着も待たずにディルックはガイアを廃墟から連れ出すと、ほどよい大きさの岩のまえで足をとめた。':'ふたりは次々と商人たちを拘束した。ガイアが騎士団に伝書鳩をとばしたのを確認すると、ディルックはガイアを廃墟から連れ出し、ほどよい大きさの岩のまえで足をとめた。')+p('ディルックはガイアの袖に目を落とし、手当ての道具を取り出した。')+say('ディルック','手当てをする。君は座っていてくれ。')+say('ガイア','何も訊かないんだな。')+say('ディルック','いまさらだ。それよりも君が攻撃を避けそこねるとはね。靴の裏に氷でも張っていたのか？　スケートは苦手なようだな。')+say('ガイア','おいおい、少し手厳しすぎやしないか？')+say('ディルック','言い返す元気があるようで、なによりだ。'),[C('「大したことないさ」','aftercare',()=>{s.mask+=2;s.route='hide'}),C('「……少し手を貸してくれるか」','aftercare',()=>{s.trust+=2;s.route='help'}),C('「なあ、どうして来てくれた？」','aftercare',()=>{s.trust++;s.insight++;s.route='ask'})])},
aftercare(){let a=s.route==='hide'?'':s.route==='help'?say('ディルック','君が素直なのは珍しいな。明日は雪が降るかもしれない。')+say('ガイア','安全に雪遊びができるなら、いいことじゃないか。')+say('ディルック','騎士団で雪合戦でもするつもりか？')+say('ガイア','それもいいな。大団長に提案してみるか。はは、冗談だ。'):say('ディルック','君を放っておけなかった。それだけじゃ、答えにならないか？')+say('ガイア','……いや。十分だよ。');render('第五章　二羽の帰り道','02:10 / アカツキワイナリー',p('ディルックはガイアを連れてアカツキワイナリーへ帰った。暖炉のそばの椅子に腰をおろしゆらゆらと揺れる炎を見つめる。'+(s.route==='help'?'':'やがて、囁くようにガイアが言った。'))+a+say('ガイア','……商人は、家族を救いたかったらしい。')+say('ディルック','事情は理解できる。だが、他人を傷つけていい理由にはならない。')+say('ガイア','俺の血が本当に誰かを癒せるかも、わからないのにな。')+say('ディルック','文献に書かれていることが、すべて事実とは限らない。')+say('ガイア','……もし、事実だったら？')+say('ディルック','ふん。それでも、君の意思を無視していい理由にはならない。')+p('ディルックは古文書の写しを机に置いた。')+say('ディルック','この写しを見てくれ。本文と余白の文字が、どうも違う。')+say('ガイア','……ああ。今夜の謎も、あと少しってところか。'),[C('事件の情報を整理する','conclusion')])},
conclusion(){addClue('margin');s.insight+=1;render('終章　羽を脱ぐ夜明け','夜明け前 / アカツキワイナリー',say('ガイア','古い民の銀色の血に癒やしの伝承はある。だが、俺の血に同じ力があるとは誰も証明していない。')+say('ディルック','商人は望む結論に合わせて文献を読んだ。あるいは、誰かにそう読まされた。')+say('ガイア','送金控えの相手も不明だ。血の色を「確認済み」とした情報源も、まだわからない。')+say('ディルック','騎士団には商人の行動と偽装された文書を報告できる。君の血の詳細を公にする必要はない。')+say('ガイア','……それでも、次は誰が動くかわからないな。')+p('窓の外に夜明けの気配が差し込む。ガイアは、どう答えるだろう。'),[C('何も言わず、いつもの軽口で帰る','end1',()=>{s.mask+=2}),C('秘密を守りながら、協力を約束する','end2',()=>{s.trust++}),C('夜明けまで残る','end3',()=>{s.trust+=2},s.trust>=3&&s.insight>=3)])},
end1(){end('1','仮面を纏うカラス',say('ガイア','さて、夜遊びもほどほどにしないとな。世話になったぜ、ディルックの旦那。')+say('ディルック','医師の確認が済むまでは休んでいてくれ。君はいつも急ぎすぎる。')+say('ガイア','はいはい。今日はおとなしくしておくさ。')+p('事件の記録は整い、噂の出所も引き続き調査されることになった。ガイアは自分の秘密を守り抜く。')+p('それでも、帰り際に借りた外套を返すときだけ、いつもの冗談が少し遅れた。'))},
end2(){end('2','約束の夜明け',say('ガイア','俺の血のことは、まだ誰にも話したくない。だが、事件の続きを追うなら……ディルック。あんたにも協力してほしい。')+say('ディルック','もちろんだ。僕も調べておく。君の秘密を、勝手に他人へ話したりはしない。')+say('ガイア','……頼りにしてるぜ。')+say('ディルック','無茶をしないこと。それだけは約束してくれ。')+say('ガイア','努力はするさ。……いや、今度は本当に。')+p('ディルックは静かに頷いた。二人の間に残る秘密は、今夜すべて消えたわけではない。それでもガイアは、次の夜には一人で立たなくてもいいと思えた。'))},
end3(){end('3','奇跡よりも大切なもの',p('ディルックは一瞬だけ言葉を止めた。暖炉の火が、二人の間で静かに揺れる。')+say('ディルック','……今夜は、最初からそのつもりだった。')+say('ガイア','俺の血に奇跡なんて、ないかもしれないぜ。')+say('ディルック','それで構わない。僕にとって、君は奇跡のためにここにいるわけじゃない。')+p('ガイアは、長く言えなかった言葉を小さく口にした。')+say('ガイア','……ただいま。')+say('ディルック','……おかえり、ガイア。')+p('孔雀の羽を纏ったカラスは、今夜だけは羽を飾らず、夜明けを迎えた。'))}
};function end(number,name,body){s.ending=name;render('夜明けの先へ','THE END',body+`<div class="rule"></div><div class="ending-number">ENDING ${esc(number.padStart(2,'0'))}</div><div class="ending-title">${esc(name)}</div>`,[C('最初から別の結末を探す','start',reset)],'',true)}function shareX(){const url='https://shisui-akiyama.github.io/kaeya-hbd-2026/';const msg=`『孔雀の羽を纏うカラス ― 白銀の夜 ―』で「${s.ending}」エンドを迎えました。\n#孔雀の羽を纏うカラス`;window.open('https://twitter.com/intent/tweet?'+new URLSearchParams({text:msg,url}).toString(),'_blank','noopener,noreferrer')}function wrap(ctx,str,x,y,maxWidth,lineHeight){let line='';for(const ch of str){const next=line+ch;if(ctx.measureText(next).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;line=ch}else line=next}if(line){ctx.fillText(line,x,y);y+=lineHeight}return y}function saveEndingImage(){if(!s.ending)return;const c=document.createElement('canvas');c.width=1200;c.height=630;const ctx=c.getContext('2d');if(!ctx){alert('画像を作成できませんでした');return}const grad=ctx.createLinearGradient(0,0,1200,630);grad.addColorStop(0,'#111a25');grad.addColorStop(.6,'#25313d');grad.addColorStop(1,'#47333d');ctx.fillStyle=grad;ctx.fillRect(0,0,1200,630);ctx.strokeStyle='#c8aa7c';ctx.lineWidth=3;ctx.strokeRect(42,42,1116,546);ctx.fillStyle='#dfc18a';ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('孔雀の羽を纏うカラス',600,165);ctx.fillStyle='#d4dce0';ctx.font='25px sans-serif';ctx.fillText('― 白銀の夜 ―',600,216);ctx.fillStyle='#b7a7aa';ctx.font='24px sans-serif';ctx.fillText('YOUR ENDING',600,316);ctx.fillStyle='#f4e8d1';ctx.font='bold 58px serif';wrap(ctx,s.ending,600,405,1020,76);ctx.fillStyle='#b9c3c6';ctx.font='21px sans-serif';ctx.fillText('非公式ファン創作 / TEXT MYSTERY',600,540);const a=document.createElement('a');a.download='karasu-ending-'+({'仮面を纏うカラス':'01','約束の夜明け':'02','奇跡よりも大切なもの':'03'}[s.ending]||'00')+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}load();if(!scenes[s.node])s.node='start';go(s.node);
})();</script></body></html>
